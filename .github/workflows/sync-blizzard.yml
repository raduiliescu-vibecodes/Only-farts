name: Sync Blizzard API

# Automatic character snapshots from the official Blizzard Battle.net API
# (WoW: Forever profile namespace), every 6 hours. Needs the repository
# secrets BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET (a free API client
# from https://develop.battle.net/access/clients). Snapshots are written only
# when data/sources.json has blizzard.enabled = true.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch and compare with recorded data, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync from the Blizzard API
        id: sync
        continue-on-error: true
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: npm run sync:blizzard -- ${DRY_RUN:+--dry}
      # Refuse to commit data the site cannot build with (validates data/*.json).
      - name: Check data and types
        run: npm test && npm run typecheck
      # Commit statuses even when the sync failed, so the site shows the failure.
      - name: Commit data changes
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: Blizzard API sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - name: Report sync failure
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::The Blizzard API sync failed. See the 'Sync from the Blizzard API' step and the job summary."
          exit 1

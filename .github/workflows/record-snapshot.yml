name: Record snapshot

# Manual entry form (Actions tab → Record snapshot → Run workflow), one character
# per run. Copy the values from the character's AOTC.gg page; leave unknown
# fields blank. The commit triggers a Vercel production deploy.
on:
  workflow_dispatch:
    inputs:
      character:
        description: "Character"
        type: choice
        required: true
        options:
          - taipan-ismydaddy
          - phender-kx
          - fishlock-thefirst
          - sisu-jr
      level:
        description: "Level (1-60)"
        required: false
      gear_score:
        description: "Gear Score"
        required: false
      item_level:
        description: "Item level"
        required: false
      class_name:
        description: "Class, e.g. Priest"
        required: false
      race:
        description: "Race, e.g. Human"
        required: false
      captured_at:
        description: "When the values were read, with time zone, e.g. 2026-11-07T17:27+02:00 (blank = now)"
        required: false
      extra:
        description: "Extra stats, e.g. health=357; mana=839; spell crit=5.3%; honorable kills=0; talents=Discipline 2 / Holy 0 / Shadow 7"
        required: false
      note:
        description: "Note shown in the history table, e.g. source of the values"
        required: false

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the branch tip at job start (not the SHA from dispatch time), so
      # queued data runs build on each other instead of conflicting.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Inputs travel through env (never interpolated into the script) and are
      # validated by scripts/record-snapshot.ts.
      - name: Record snapshot
        env:
          CHARACTER: ${{ inputs.character }}
          LEVEL: ${{ inputs.level }}
          GEAR_SCORE: ${{ inputs.gear_score }}
          ITEM_LEVEL: ${{ inputs.item_level }}
          CLASS_NAME: ${{ inputs.class_name }}
          RACE: ${{ inputs.race }}
          CAPTURED_AT: ${{ inputs.captured_at }}
          EXTRA: ${{ inputs.extra }}
          NOTE: ${{ inputs.note }}
        run: |
          args=(--character "$CHARACTER")
          [ -n "$LEVEL" ] && args+=(--level "$LEVEL")
          [ -n "$GEAR_SCORE" ] && args+=(--gear-score "$GEAR_SCORE")
          [ -n "$ITEM_LEVEL" ] && args+=(--item-level "$ITEM_LEVEL")
          [ -n "$CLASS_NAME" ] && args+=(--class "$CLASS_NAME")
          [ -n "$RACE" ] && args+=(--race "$RACE")
          [ -n "$CAPTURED_AT" ] && args+=(--at "$CAPTURED_AT")
          [ -n "$EXTRA" ] && args+=(--extra "$EXTRA")
          [ -n "$NOTE" ] && args+=(--note "$NOTE")
          npm run snapshot -- "${args[@]}"
      # Refuse to commit data the site cannot build with (validates data/*.json).
      - name: Check data and types
        run: npm test && npm run typecheck
      - name: Commit snapshot
        env:
          ACTOR: ${{ github.actor }}
          CHARACTER: ${{ inputs.character }}
        run: |
          if git diff --quiet -- data/history.json; then
            echo "Snapshot already recorded; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "data: manual snapshot for ${CHARACTER} by ${ACTOR}"
          git pull --rebase
          git push

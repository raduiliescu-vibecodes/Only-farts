name: Sync AOTC.gg

# Manual only. AOTC.gg answers every automated request with a bot checkpoint
# (HTTP 429) and offers no API, so this is no longer scheduled; automatic
# snapshots come from the Blizzard API (sync-blizzard.yml). Kept so it can be
# re-checked by hand, e.g. if AOTC.gg grants API access. Statuses go to
# data/aotc-status.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the branch tip at job start (not the SHA from dispatch time), so
      # queued data runs build on each other instead of conflicting.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
      # Refuse to commit data the site cannot build with (validates data/*.json).
      - name: Check data and types
        run: npm test && npm run typecheck
      - name: Commit data changes
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: AOTC.gg sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
